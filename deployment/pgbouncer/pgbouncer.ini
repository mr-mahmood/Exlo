
[databases]
exlo = host=postgres port=5432 dbname=exlo
test_exlo = host=postgres port=5432 dbname=test_exlo

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pool_mode = transaction

max_client_conn = 300
default_pool_size = 90
reserve_pool_size = 10
reserve_pool_timeout = 3

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
